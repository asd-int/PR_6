{% extends 'navbar.html' %}

{% block title %}Роли{% endblock %}

{% block content %}
<h1>Роли в проектах</h1>

<form method="get">
    Поиск: <input type="text" name="search" value="{{ search }}">
    <button type="submit">Найти</button>
    <a href="{% url 'project-roles' %}">Сбросить</a>
</form>

<table border="1">
    <tr><th>ID роли</th><th>Название</th></tr>
    {% for r in roles %}
    <tr>
        <td>{{ r.id_role }}</td>
        <td>{{ r.role_name }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="2" align="center">Нет данных</td></tr>
    {% endfor %}
</table>
{% endblock %}
